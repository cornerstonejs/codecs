version: 2.1

# Per-package parallel pipelines: each codec gets its own build → test →
# benchmark job, all running in parallel via a matrix. CircleCI fails the
# workflow if any matrix entry fails. After the matrix completes, a single
# aggregator job posts (or updates) a sticky comment on the PR with main-vs-PR
# benchmark numbers per codec.
#
# The lerna --since main behaviour is preserved by an in-job `git diff` check:
# packages that didn't change are skipped early. To force every package's
# pipeline to exercise on a given PR, touch its README — that makes the diff
# non-empty for that package.

executors:
  emscripten-porter:
    docker:
      - image: emscripten/emsdk:3.1.74
        environment:
          TERM: xterm
          DEBIAN_FRONTEND: noninteractive
          USERNAME: vscode
          USER_UID: 1000
          USER_GID: 1000
  node:
    docker:
      - image: cimg/node:18.20.3
        environment:
          TERM: xterm

commands:
  install-build-tools:
    description: Install yarn + cmake + C++ build deps on top of the emsdk image
    steps:
      - run:
          name: Install build tooling
          command: |
            npm install --global yarn@1.22.22
            apt-get update
            apt-get -y install build-essential
            wget -qO- "https://cmake.org/files/v3.17/cmake-3.17.4-Linux-x86_64.tar.gz" \
              | tar --strip-components=1 -xz -C /usr/local
            apt-get autoremove -y
            apt-get clean -y
            rm -rf /var/lib/apt/lists/*

  install-deps:
    description: yarn install at the workspace root (with cache)
    steps:
      - restore_cache:
          keys:
            - yarn-{{ checksum "yarn.lock" }}
            - yarn-
      - run: yarn install --frozen-lockfile
      - save_cache:
          key: yarn-{{ checksum "yarn.lock" }}
          paths:
            - ~/.cache/yarn

jobs:
  # One matrix entry per package. Builds, tests, and benchmarks the package
  # against both the PR version and the main baseline. Persists JSON to a
  # shared workspace consumed by post-benchmark-comment.
  build-and-test-package:
    parameters:
      package:
        type: string
    executor: emscripten-porter
    working_directory: ~/repo
    steps:
      - install-build-tools
      - checkout
      - run:
          name: Skip if package unchanged since main
          command: |
            set -e
            git fetch --no-tags --depth=50 origin main || true
            BASE=$(git merge-base origin/main HEAD || echo "origin/main")
            if git diff --quiet "$BASE"..HEAD -- "packages/<< parameters.package >>/"; then
              echo "packages/<< parameters.package >> unchanged since $BASE — skipping."
              circleci-agent step halt
            fi
            echo "Detected changes in packages/<< parameters.package >>; proceeding."
      - run:
          name: Init submodules for this package
          command: |
            if [ -d "packages/<< parameters.package >>/extern" ]; then
              git submodule update --init --recursive "packages/<< parameters.package >>/extern"
            else
              echo "No extern/ submodule for << parameters.package >>; skipping."
            fi
      - install-deps
      - run:
          name: Build PR version
          command: |
            set +e
            mkdir -p /tmp/benchmarks
            (cd "packages/<< parameters.package >>" && yarn run build:ci)
            EXIT=$?
            if [ $EXIT -eq 0 ]; then
              echo '{"package":"<< parameters.package >>","buildStatus":"pass"}' \
                > /tmp/benchmarks/<< parameters.package >>-build.json
            else
              echo '{"package":"<< parameters.package >>","buildStatus":"fail","exitCode":'$EXIT'}' \
                > /tmp/benchmarks/<< parameters.package >>-build.json
            fi
            exit 0
      - run:
          name: Test PR version
          command: |
            set +e
            mkdir -p /tmp/benchmarks
            (cd "packages/<< parameters.package >>" && yarn run test:ci)
            EXIT=$?
            if [ $EXIT -eq 0 ]; then
              echo '{"package":"<< parameters.package >>","testStatus":"pass"}' \
                > /tmp/benchmarks/<< parameters.package >>-test.json
            else
              echo '{"package":"<< parameters.package >>","testStatus":"fail","exitCode":'$EXIT'}' \
                > /tmp/benchmarks/<< parameters.package >>-test.json
            fi
            exit 0
      - run:
          name: Benchmark PR version
          command: |
            mkdir -p /tmp/benchmarks
            node scripts/ci/benchmark.js << parameters.package >> pr \
              > /tmp/benchmarks/<< parameters.package >>-pr.json 2>/tmp/benchmarks/<< parameters.package >>-pr.log || true
            cat /tmp/benchmarks/<< parameters.package >>-pr.json
      - run:
          name: Build + benchmark main baseline (best-effort)
          command: |
            set +e
            mkdir -p /tmp/benchmarks
            PR_SHA=$(git rev-parse HEAD)
            # Move PR state aside; if anything fails here we just emit an
            # `error` benchmark record so the comment renders gracefully.
            if ! git checkout origin/main -- "packages/<< parameters.package >>" 2>/tmp/main-checkout.err; then
              echo '{"package":"<< parameters.package >>","side":"main","error":"main checkout failed"}' \
                > /tmp/benchmarks/<< parameters.package >>-main.json
              git checkout "$PR_SHA" -- "packages/<< parameters.package >>" || true
              exit 0
            fi
            if [ -d "packages/<< parameters.package >>/extern" ]; then
              git submodule update --init --recursive "packages/<< parameters.package >>/extern" || true
            fi
            (cd "packages/<< parameters.package >>" && yarn run build:ci) \
              || echo '{"package":"<< parameters.package >>","side":"main","error":"main build failed"}' \
                > /tmp/benchmarks/<< parameters.package >>-main.json
            if [ ! -s /tmp/benchmarks/<< parameters.package >>-main.json ]; then
              node scripts/ci/benchmark.js << parameters.package >> main \
                > /tmp/benchmarks/<< parameters.package >>-main.json \
                2>/tmp/benchmarks/<< parameters.package >>-main.log || true
            fi
            cat /tmp/benchmarks/<< parameters.package >>-main.json
            git checkout "$PR_SHA" -- "packages/<< parameters.package >>" || true
      - persist_to_workspace:
          root: /tmp
          paths:
            - benchmarks
      - store_artifacts:
          path: /tmp/benchmarks
          destination: benchmarks

  # Aggregator: reads all benchmark JSONs and posts/updates one sticky comment
  # on the PR. Requires GITHUB_TOKEN to be configured as a CircleCI env var.
  post-benchmark-comment:
    executor: node
    working_directory: ~/repo
    steps:
      - checkout
      - attach_workspace:
          at: /tmp
      - run:
          name: List benchmark artifacts
          command: ls -la /tmp/benchmarks || echo "no benchmarks/"
      - run:
          name: Post / update sticky PR comment
          command: |
            if [ -z "$GITHUB_TOKEN" ] && [ -n "$GH_TOKEN" ]; then
              export GITHUB_TOKEN="$GH_TOKEN"
            fi
            if [ -z "$GITHUB_TOKEN" ]; then
              echo "GITHUB_TOKEN not configured; printing comment body instead."
              DRY_RUN=1 node scripts/ci/post-benchmark-comment.js
            else
              node scripts/ci/post-benchmark-comment.js
            fi

  # Gate job: runs after post-benchmark-comment so the comment is always posted
  # before the workflow can fail. Reads the per-package build/test status JSON
  # from the workspace and exits non-zero if any package failed.
  ci-gate:
    executor: node
    working_directory: ~/repo
    steps:
      - attach_workspace:
          at: /tmp
      - run:
          name: Fail workflow if any package build or test failed
          command: |
            set -e
            shopt -s nullglob
            FAILED=0
            for f in /tmp/benchmarks/*-build.json /tmp/benchmarks/*-test.json; do
              if grep -q '"\(buildStatus\|testStatus\)":"fail"' "$f"; then
                echo "FAIL: $f"
                cat "$f"
                FAILED=1
              fi
            done
            if [ "$FAILED" -ne 0 ]; then
              echo
              echo "One or more package build/test steps failed (comment already posted)."
              exit 1
            fi
            echo "All package builds and tests passed."

  NPM_PUBLISH:
    executor: emscripten-porter
    working_directory: ~/repo
    steps:
      - install-build-tools
      - checkout
      - run: git submodule update --init --recursive
      - restore_cache:
          keys:
            - yarn-{{ checksum "yarn.lock" }}
            - yarn-
      - run: yarn install --frozen-lockfile
      - run: yarn run build:publish
      - save_cache:
          key: yarn-{{ checksum "yarn.lock" }}
          paths:
            - ~/.cache/yarn
      - run:
          name: Configure git + npm auth
          command: |
            rm -rf ~/.ssh
            mkdir -p ~/.ssh/
            echo -e "Host github.com\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
            git config --global user.email "danny.ri.brown@gmail.com"
            git config --global user.name "dannyrb"
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/repo/.npmrc
      - run: npm whoami
      - run: npx lerna version
      - run: npx lerna publish from-package

workflows:
  version: 2

  PR_CHECKS:
    jobs:
      - build-and-test-package:
          name: pkg-<< matrix.package >>
          matrix:
            parameters:
              package:
                - charls
                - libjpeg-turbo-8bit
                - libjpeg-turbo-12bit
                - openjpeg
                - openjphjs
                - little-endian
                - big-endian
                - dicom-codec
          filters:
            branches:
              ignore:
                - main
      - post-benchmark-comment:
          requires:
            - build-and-test-package
          filters:
            branches:
              ignore:
                - main
      - ci-gate:
          requires:
            - post-benchmark-comment
          filters:
            branches:
              ignore:
                - main

  DEPLOY:
    jobs:
      - NPM_PUBLISH:
          filters:
            branches:
              only: main
